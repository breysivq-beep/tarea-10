<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #contenido{
            width: 90%;
            height: 450px;
            border: 1px solid rgb(75, 73, 73);
            margin: auto;
            padding: 10px;
            display: grid;
            grid-template-areas:"uno dos dos tres"
                                "uno cinco siete cuatro"
                                "uno ocho seis cuatro";

            grid-template-columns:4 2fr ;
            grid-template-rows:3, 1fr;
            gap: 10px;
        }

        .caja{
            width: 100%;
            height: 100%;
            border: 1px solid black;
            color: rgb(244, 241, 241);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .uno{
            grid-area: uno;      
            background: linear-gradient(to right, green, white);
        }

        .dos{
            grid-area: dos;
            background: linear-gradient(to bottom, green, white)
        }

        .tre{
            grid-area: tres;
            background: radial-gradient(red, white);
        }

        .cuatro{
            grid-area: cuatro;
            background: linear-gradient(35deg, green, white)
        }

        .cinco{
            grid-area: cinco;
            background: repeating-linear-gradient(45deg, orange,orange 5px, white 5px, white 10px);
            color: black;
        }

        .seis{
            grid-area: seis;
            background: repeating-radial-gradient(circle 50px, orange, orange 5px, white 2px, white 10px);
            color: black;
        }

        .siete{
            grid-area: siete;
            background: radial-gradient(circle 200px, red, white);
        }

        .ocho{
            grid-area: ocho;
            background: radial-gradient(circle farthest-corner, red, white);
        }

    </style>
</head> 
<body>
    <h1>grid 1</h1>
    <div id="contenido">
        <div class="caja uno">UNO</div>
        <div class="caja dos">DOS</div>
        <div class="caja tre">TRES</div>
        <div class="caja cuatro">CUATRO</div>
        <div class="caja cinco">CINCO</div>
        <div class="caja seis">SEIS</div>
        <div class="caja siete">SIETE</div>
        <div class="caja ocho">OCHO>
    </div>
</body>
</html>
